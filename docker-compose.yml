services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
      - "10023:10023/udp"
      - "10024:10024/udp"
    environment:
      M32_MODE: ${M32_MODE:-simulator}
      M32_HOST: ${M32_HOST:-192.168.1.100}
      M32_PORT: ${M32_PORT:-10023}
      OSC_LISTEN_HOST: 0.0.0.0
      OSC_LISTEN_PORT: 10024
      SIMULATOR_HOST: 0.0.0.0
      SIMULATOR_PORT: 10023
    command: uvicorn m32_monitor.main:app --host 0.0.0.0 --port 8000 --reload
